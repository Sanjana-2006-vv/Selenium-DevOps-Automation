
name: Selenium Docker Hub Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Diagnose Docker Hub Authentication
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DH_USER" ] || [ -z "$DH_TOKEN" ]; then
            echo "ERROR: A Docker Hub secret is empty"
            exit 1
          fi

          if [[ "$DH_USER" =~ [[:space:]] ]] || [[ "$DH_TOKEN" =~ [[:space:]] ]]; then
            echo "ERROR: A secret contains whitespace"
            exit 1
          fi

          echo "Checking Docker Hub credentials..."

          HTTP_STATUS=$(curl --silent --show-error \
            --output /tmp/docker-auth.json \
            --write-out "%{http_code}" \
            --user "$DH_USER:$DH_TOKEN" \
            "https://auth.docker.io/token?service=registry.docker.io")

          echo "HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Docker Hub authentication failed"
            exit 1
          fi

          echo "Docker Hub credentials verified."

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/selenium-devops-automation:1.0 .

      - name: Push Docker Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/selenium-devops-automation:1.0

      - name: Deployment Completed
        run: echo "Selenium Docker image pushed successfully!"
